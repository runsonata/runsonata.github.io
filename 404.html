<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party - 404</title>
    <link rel="stylesheet" type="text/css"
        href="http://fonts.googleapis.com/css?family=Ubuntu:regular,bold&subset=Latin">
    <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.22/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.22/dist/cdn/beer.min.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="manifest" href="/static/favicons/site.webmanifest">
    <style>
        body {
            font-family: Ubuntu, "times new roman", times, roman, serif;
        }
    </style>
</head>

<body class="dark">
    <main class="responsive">
        <div class="medium middle-align center-align vertical absolute center middle">
            <h1 class="no-padding">404</h1>
            <h5 id="h-title" class="no-padding">Page not found</h5>
            <p id="p-description" class="no-padding">The page you are looking for does not exist.</p>
            <nav class="center-align">
                <button id="btn-back">Go back</button>
            </nav>
        </div>
    </main>
    <script>
        document.getElementById('btn-back').addEventListener('click', function () {
            window.history.back();
        });

        const predefinedMessages = [
            "Oops! Looks like you've taken a wrong turn.",
            "Searching for a page that doesn't exist",
            "The page you're looking for isn't here. Maybe search somewhere else?",
            "The page you seek was succumbed to the void.",
            "But hey, at least you're here!",
            "Looks like you've stumbled upon a digital Bermuda Triangle.",
            "This page is playing hide and seek, and it's winning.",
            "Whoops! This page is currently out of service.",
            "The page you are looking for is taking a coffee break.",
            "Not quite my tempo. The page is gonna be on my time.",
            "The page you're looking for doesn't exist, but I do!",
            "Looks like the page didn't show up to the \"party\". Get it?"
        ];

        const randomMessage = predefinedMessages[Math.floor(Math.random() * predefinedMessages.length)];
        document.getElementById('p-description').textContent = randomMessage;
    </script>
</body>

</html>
